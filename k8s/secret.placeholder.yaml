# Manifesto "pronto para aplicar" com placeholders literais (sem segredos reais).
# Fluxo: copiar para secret.yaml, substituir <...>, aplicar. secret.yaml está em .gitignore.
#
#   cp k8s/secret.placeholder.yaml k8s/secret.yaml
#   # editar valores entre <>
#   kubectl apply -f k8s/secret.yaml
#
# Para desenvolvimento rápido com valores fictícios, use em alternativa `secret.example.yaml`.
apiVersion: v1
kind: Secret
metadata:
  name: oficina-app-secret
  namespace: oficina
  labels:
    app.kubernetes.io/name: oficina-app
    app.kubernetes.io/component: api
type: Opaque
stringData:
  DB_URL: "jdbc:postgresql://<POSTGRES_HOST>:5432/<DATABASE_NAME>"
  DB_USER: "<DATABASE_USER>"
  DB_PASS: "<DATABASE_PASSWORD>"
