name: CI

on:
  workflow_dispatch:
  push:
    branches: [develop, master]
  pull_request:
    branches: [develop, master]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: "21"
          distribution: temurin
          cache: maven

      - name: Build and test (sem integração Docker)
        run: mvn -B -Pci verify

  terraform:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.9.8

      - name: Terraform fmt (check) — AWS
        working-directory: infra
        run: terraform fmt -check -recursive

      - name: Terraform fmt (check) — Kind
        working-directory: infra/kind
        run: terraform fmt -check -recursive

      - name: Terraform init/validate — AWS
        working-directory: infra
        run: |
          terraform init -backend=false
          terraform validate

      - name: Terraform init/validate — Kind
        working-directory: infra/kind
        run: |
          terraform init -backend=false
          terraform validate

  docker:
    needs: [build, terraform]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.ref_name }}
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
